name: "Updatecli - Bump test-environment image tags"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"
  pull_request:
    paths:
      - ".updatecli/**"
      - ".github/workflows/updatecli.yml"

permissions:
  contents: read

jobs:
  updatecli:
    name: "Run updatecli"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: "Checkout shared version policy"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Alfresco/alfresco-updatecli
          ref: master
          sparse-checkout: |
            deployments/values/supported-matrix.yaml
          sparse-checkout-cone-mode: false
          path: alfresco-updatecli
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: updatecli/updatecli-action@ca8c01bf875e2520512c344a71dd02f3dc3326a7 # v3.7.0
      - name: "updatecli diff"
        if: github.event_name == 'pull_request'
        run: updatecli diff --config .updatecli/test-environment.yaml --values alfresco-updatecli/deployments/values/supported-matrix.yaml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_ACTOR: ${{ steps.app-token.outputs.app-slug }}[bot]
      - name: "updatecli apply"
        if: github.event_name != 'pull_request'
        run: updatecli apply --config .updatecli/test-environment.yaml --values alfresco-updatecli/deployments/values/supported-matrix.yaml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_ACTOR: ${{ steps.app-token.outputs.app-slug }}[bot]

name: Alfresco Community Repo CI

# Entry point for CI. This file is identical on every branch, so a newly cut release branch needs no CI change.
# - PRs into master and pushes to master/feature/fix branches run this branch's own ci-jobs.yml, so a PR that changes CI
#   tests its own change.
# - Release branches (PRs into them, pushes and master_release.yml runs) always run master's ci-jobs.yml, so CI fixes
#   reach them without a backport. What they test still comes from their own .github/ci-config.yml.
# uses: cannot be an expression, hence two jobs where exactly one runs and the other shows as skipped.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  push:
    branches:
      - feature/**
      - fix/**
  workflow_call:
    secrets:
      AGS_AWS_ACCESS_KEY_ID:
        required: false
      AGS_AWS_SECRET_ACCESS_KEY:
        required: false
      AUTH0_OIDC_ADMIN_CLIENT_ID:
        required: false
      AUTH0_OIDC_ADMIN_PASSWORD:
        required: false
      AUTH0_OIDC_CLIENT_SECRET:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_USERNAME:
        required: false
      GH_APP_ENGINEERING_RO_PRIVATE_KEY:
        required: false
      QUAY_PASSWORD:
        required: false
      QUAY_USERNAME:
        required: false
  workflow_dispatch:

jobs:
  ci:
    name: CI
    if: ${{ !startsWith(github.base_ref || github.ref_name, 'release/') }}
    # Cloudsmith authentication needs id-token: write; pmd_scan uploads SARIF and needs security-events: write
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/ci-jobs.yml
    secrets: inherit # pragma: allowlist secret

  ci_release:
    name: CI
    if: ${{ startsWith(github.base_ref || github.ref_name, 'release/') }}
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: Alfresco/alfresco-community-repo/.github/workflows/ci-jobs.yml@master
    secrets: inherit # pragma: allowlist secret

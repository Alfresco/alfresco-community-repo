name: Alfresco Community Repo CI

# This branch runs master's CI workflow instead of keeping its own copy (ACS-13096), so CI fixes and improvements
# made on master apply here without a backport. Only the settings where this branch differs from master are passed
# below; everything else uses master's defaults (see the workflow_call inputs in master's ci.yml).
# master_release.yml calls this file as well, so this is the single place for this branch's CI settings.
# There is deliberately no concurrency block: master's ci.yml defines it, and the same group here would cancel the run.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  push:
    branches:
      - feature/**
      - fix/**
  workflow_call:
  workflow_dispatch:

jobs:
  ci:
    # Cloudsmith authentication needs id-token: write; the pmd_scan job uploads SARIF and needs security-events: write
    permissions:
      contents: read
      id-token: write
      security-events: write
    # TODO ACS-13096: temporary ref so this PR can test master's new ci.yml before it is merged.
    # Switch back to @master once the master PR (feature/ACS-13096) is merged, and before merging this PR.
    uses: Alfresco/alfresco-community-repo/.github/workflows/ci.yml@feature/ACS-13096
    secrets: inherit # pragma: allowlist secret
    with:
      # The Part1/2/3 split of this suite (ACS-13092) is not on this branch
      elasticsearch-test-suites: "[ElasticsearchCommunityTestsTestSuite]"
      # This branch's TAS suites: no REST API part4, CMIS not split into parts and no Elasticsearch E2E tests
      tas-tests: |
        - test-name: "REST API TAS tests part1"
          pom-dir: tas-restapi
          test-profile: run-restapi-part1
        - test-name: "REST API TAS tests part2"
          pom-dir: tas-restapi
          test-profile: run-restapi-part2
        - test-name: "REST API TAS tests part3"
          pom-dir: tas-restapi
          test-profile: run-restapi-part3
        - test-name: "CMIS TAS tests - BROWSER binding"
          pom-dir: tas-cmis
          test-profile: run-cmis-browser
        - test-name: "CMIS TAS tests - ATOM binding"
          pom-dir: tas-cmis
          test-profile: run-cmis-atom
        - test-name: "CMIS TAS tests - WEBSERVICES binding"
          pom-dir: tas-cmis
          test-profile: run-cmis-webservices
        - test-name: "Email TAS tests"
          pom-dir: tas-email
        - test-name: "WebDAV TAS tests"
          pom-dir: tas-webdav
        - test-name: "Integration TAS tests"
          pom-dir: tas-integration
      # testng-part1.xml and testng-part2.xml are not on this branch
      ags-rest-api-suites: "[testng.xml]"

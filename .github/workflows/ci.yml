name: Alfresco Community Repo CI

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  push:
    branches:
      - feature/**
      - fix/**
  workflow_call:
    # Release branches run this workflow through a thin caller instead of keeping their own copy (ACS-13047).
    # Every input is optional: an empty value means master's default (see "Resolve CI configuration" in
    # commit_parser). List inputs accept YAML or JSON; an explicit [] means "none". Quote versions as strings.
    inputs:
      java-version:
        description: "JDK used to build and test (default: 21)"
        type: string
        default: ""
      db-tests:
        description: "Repository DB tests: list of {name, profile: mariadb|mysql|postgres, version, pr-gated}; pr-gated entries run on PRs only with [db] in the title"
        type: string
        default: ""
      activemq-profiles:
        description: "docker-compose.yaml profiles for the messaging tests (default: [activemq6, activemq5])"
        type: string
        default: ""
      elasticsearch-test-suites:
        description: "Elasticsearch suites added to the repository app context tests (default: the Part1/2/3 suites)"
        type: string
        default: ""
      tas-tests:
        description: "Full TAS test matrix: list of {test-name, pom-dir, test-profile, compose-file, mvn-options}"
        type: string
        default: ""
      ags-rest-api-suites:
        description: "TestNG suite files for the AGS Community REST API tests (default: [testng-part1.xml, testng-part2.xml])"
        type: string
        default: ""
    secrets:
      AGS_AWS_ACCESS_KEY_ID:
        required: false
      AGS_AWS_SECRET_ACCESS_KEY:
        required: false
      AUTH0_OIDC_ADMIN_CLIENT_ID:
        required: false
      AUTH0_OIDC_ADMIN_PASSWORD:
        required: false
      AUTH0_OIDC_CLIENT_SECRET:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_USERNAME:
        required: false
      GH_APP_ENGINEERING_RO_PRIVATE_KEY:
        required: false
      QUAY_PASSWORD:
        required: false
      QUAY_USERNAME:
        required: false
  workflow_dispatch:

# Cancel superseded runs for pull requests and feature/fix branch pushes. Master/release runs (including those via
# master_release.yml, where github.* describes the caller) get a unique group so they are never cancelled or queued.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/'))
    && format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref)
    || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

env:
  JAVA_VERSION: ${{ inputs.java-version || '21' }}
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  LOG_WARN: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  CI_WORKSPACE: ${{ github.workspace }}
  TAS_ENVIRONMENT: ./packaging/tests/environment
  TAS_SCRIPTS: ../alfresco-community-repo/packaging/tests/scripts

jobs:
  commit_parser:
    name: "Parse commit metadata"
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
      db-tests: ${{ steps.ci-config.outputs.db-tests }}
      activemq-profiles: ${{ steps.ci-config.outputs.activemq-profiles }}
      app-context-tests: ${{ steps.ci-config.outputs.app-context-tests }}
      tas-tests: ${{ steps.ci-config.outputs.tas-tests }}
      ags-rest-api-suites: ${{ steps.ci-config.outputs.ags-rest-api-suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-commit-message@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        id: get-commit
        with:
          header-only: "true"
      # Test matrices that differ per branch. The DEFAULT_* values are master's; release branches override them
      # through the workflow_call inputs. This must stay inline: the checkout is the calling branch's code.
      - name: "Resolve CI configuration"
        id: ci-config
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_TITLE: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
          INPUT_DB_TESTS: ${{ inputs.db-tests }}
          INPUT_ACTIVEMQ_PROFILES: ${{ inputs.activemq-profiles }}
          INPUT_ELASTICSEARCH_TEST_SUITES: ${{ inputs.elasticsearch-test-suites }}
          INPUT_TAS_TESTS: ${{ inputs.tas-tests }}
          INPUT_AGS_REST_API_SUITES: ${{ inputs.ags-rest-api-suites }}
          DEFAULT_DB_TESTS: |
            - name: MariaDB 10.11
              profile: mariadb
              version: "10.11"
              pr-gated: true
            - name: MariaDB 11.8
              profile: mariadb
              version: "11.8"
            - name: MySQL 8
              profile: mysql
              version: "8"
            - name: PostgreSQL 15.17
              profile: postgres
              version: "15.17"
              pr-gated: true
            - name: PostgreSQL 16.13
              profile: postgres
              version: "16.13"
              pr-gated: true
            - name: PostgreSQL 17.9
              profile: postgres
              version: "17.9"
          DEFAULT_ACTIVEMQ_PROFILES: "[activemq6, activemq5]"
          DEFAULT_ELASTICSEARCH_TEST_SUITES: |
            - ElasticsearchCommunityTestsPart1TestSuite
            - ElasticsearchCommunityTestsPart2TestSuite
            - ElasticsearchCommunityTestsPart3TestSuite
          # Not an input: the same on every branch. The Elasticsearch suites are appended to it.
          APP_CONTEXT_TESTS: |
            - testSuite: AppContext01TestSuite
              compose-profile: with-transform-core-aio
            - testSuite: AppContext02TestSuite
              compose-profile: default
            - testSuite: AppContext03TestSuite
              compose-profile: with-transform-core-aio
            - testSuite: AppContext04TestSuite
              compose-profile: with-transform-core-aio
            - testSuite: AppContext05TestSuite
              compose-profile: with-sso
              mvn-options: '-Didentity-service.auth-server-url=http://${HOST_IP}:8999/auth -Dauthentication.chain=identity-service1:identity-service,alfrescoNtlm1:alfrescoNtlm'
              idp: Keycloak
            - testSuite: AppContext05TestSuite
              compose-profile: default
              mvn-options: '-Didentity-service.auth-server-url=https://dev-ps-alfresco.auth0.com/ -Dauthentication.chain=identity-service1:identity-service,alfrescoNtlm1:alfrescoNtlm -Didentity-service.audience=http://localhost:3000 -Didentity-service.resource=${AUTH0_CLIENT_ID} -Didentity-service.credentials.secret=${AUTH0_CLIENT_SECRET} -Didentity-service.public-client=false -Didentity-service.realm= -Didentity-service.client-id.validation.disabled=false -Dadmin.user=admin@alfresco.com -Dadmin.password=${AUTH0_ADMIN_PASSWORD} -Dauth0.enabled=true -Dauth0.admin.password=${AUTH0_ADMIN_PASSWORD} -Didentity-service.principal-attribute=nickname'
              idp: Auth0
            - testSuite: AppContext06TestSuite
              compose-profile: with-transform-core-aio
            - testSuite: AppContextExtraTestSuite
              compose-profile: with-transform-core-aio
            - testSuite: MiscContextTestSuite
              compose-profile: with-transform-core-aio
            - testSuite: SearchTestSuite
              compose-profile: default
              mvn-options: '-Dindex.subsystem.name=solr6'
            - testSuite: MTLSTestSuite
              compose-profile: with-mtls-transform-core-aio
              mtls: true
              disabledHostnameVerification: false
              mvn-options: '-Dencryption.ssl.keystore.location=${CI_WORKSPACE}/keystores/alfresco/alfresco.keystore -Dencryption.ssl.truststore.location=${CI_WORKSPACE}/keystores/alfresco/alfresco.truststore'
          DEFAULT_TAS_TESTS: |
            - test-name: "REST API TAS tests part1"
              pom-dir: tas-restapi
              test-profile: run-restapi-part1
            - test-name: "REST API TAS tests part2"
              pom-dir: tas-restapi
              test-profile: run-restapi-part2
            - test-name: "REST API TAS tests part3"
              pom-dir: tas-restapi
              test-profile: run-restapi-part3
            - test-name: "REST API TAS tests part4"
              pom-dir: tas-restapi
              test-profile: run-restapi-part4
            - test-name: "CMIS TAS tests - BROWSER binding - part1"
              pom-dir: tas-cmis
              test-profile: run-cmis-browser,cmis-part1
            - test-name: "CMIS TAS tests - BROWSER binding - part2"
              pom-dir: tas-cmis
              test-profile: run-cmis-browser,cmis-part2
            - test-name: "CMIS TAS tests - ATOM binding - part1"
              pom-dir: tas-cmis
              test-profile: run-cmis-atom,cmis-part1
            - test-name: "CMIS TAS tests - ATOM binding - part2"
              pom-dir: tas-cmis
              test-profile: run-cmis-atom,cmis-part2
            - test-name: "CMIS TAS tests - WEBSERVICES binding - part1"
              pom-dir: tas-cmis
              test-profile: run-cmis-webservices,cmis-part1
            - test-name: "CMIS TAS tests - WEBSERVICES binding - part2"
              pom-dir: tas-cmis
              test-profile: run-cmis-webservices,cmis-part2
            - test-name: "Email TAS tests"
              pom-dir: tas-email
            - test-name: "WebDAV TAS tests"
              pom-dir: tas-webdav
            - test-name: "Integration TAS tests"
              pom-dir: tas-integration
            - test-name: "Elasticsearch E2E Tests - part1"
              pom-dir: tas-restapi
              test-profile: elasticsearch-e2e-tests-part1
              compose-file: docker-compose-minimal+batch-indexing.yml
              mvn-options: '-DsolrWaitTimeInSeconds=3'
            - test-name: "Elasticsearch E2E Tests - part2"
              pom-dir: tas-restapi
              test-profile: elasticsearch-e2e-tests-part2
              compose-file: docker-compose-minimal+batch-indexing.yml
              mvn-options: '-DsolrWaitTimeInSeconds=3'
            - test-name: "Elasticsearch E2E Tests - part3"
              pom-dir: tas-restapi
              test-profile: elasticsearch-e2e-tests-part3
              compose-file: docker-compose-minimal+batch-indexing.yml
              mvn-options: '-DsolrWaitTimeInSeconds=3'
          DEFAULT_AGS_REST_API_SUITES: "[testng-part1.xml, testng-part2.xml]"
        run: |
          set -euo pipefail
          fail() { echo "::error title=Invalid CI configuration::$1"; exit 1; }
          # Prints the input as compact JSON, or the default when the input is empty
          resolve() {
            local value="$1"
            [[ -z "${value//[[:space:]]/}" ]] && value="$2"
            yq -p=yaml -o=json -I=0 '.' <<<"${value}"
          }
          is_string_list='type == "array" and all(.[]; type == "string")'

          db_tests=$(resolve "${INPUT_DB_TESTS}" "${DEFAULT_DB_TESTS}")
          jq -e 'type == "array" and all(.[]; (.name | type == "string") and (.profile | IN("mariadb", "mysql", "postgres")) and (.version | type == "string"))' <<<"${db_tests}" >/dev/null \
            || fail "db-tests: every entry needs a name, a profile (mariadb, mysql or postgres) and a quoted version"
          # Same rule as before: pr-gated DB tests run on PRs only when the title contains [db] (case-insensitive like contains())
          shopt -s nocasematch
          if [[ "${EVENT_NAME}" == "pull_request" && "${COMMIT_TITLE}" != *"[db]"* ]]; then
            db_tests=$(jq -c '[.[] | select(."pr-gated" != true)]' <<<"${db_tests}")
          fi
          shopt -u nocasematch

          activemq_profiles=$(resolve "${INPUT_ACTIVEMQ_PROFILES}" "${DEFAULT_ACTIVEMQ_PROFILES}")
          jq -e "${is_string_list}" <<<"${activemq_profiles}" >/dev/null || fail "activemq-profiles must be a list of profile names"

          es_suites=$(resolve "${INPUT_ELASTICSEARCH_TEST_SUITES}" "${DEFAULT_ELASTICSEARCH_TEST_SUITES}")
          jq -e "${is_string_list}" <<<"${es_suites}" >/dev/null || fail "elasticsearch-test-suites must be a list of test suite names"
          app_context_tests=$(yq -p=yaml -o=json -I=0 '.' <<<"${APP_CONTEXT_TESTS}" | jq -c --argjson es "${es_suites}" \
            '. + [$es[] | {testSuite: ., "compose-profile": "with-elasticsearch", "mvn-options": "-Dindex.subsystem.name=elasticsearch"}]')

          tas_tests=$(resolve "${INPUT_TAS_TESTS}" "${DEFAULT_TAS_TESTS}")
          jq -e 'type == "array" and all(.[]; (."test-name" | type == "string") and (."pom-dir" | type == "string"))' <<<"${tas_tests}" >/dev/null \
            || fail "tas-tests: every entry needs a test-name and a pom-dir"

          ags_suites=$(resolve "${INPUT_AGS_REST_API_SUITES}" "${DEFAULT_AGS_REST_API_SUITES}")
          jq -e "${is_string_list}" <<<"${ags_suites}" >/dev/null || fail "ags-rest-api-suites must be a list of TestNG suite files"
          # testng-part1.xml -> part1 (keeps the existing job names and S3 paths); testng.xml -> all
          ags_suites=$(jq -c '[.[] | {name: (rtrimstr(".xml") | ltrimstr("testng") | ltrimstr("-") | if . == "" then "all" else . end), "suite-file": .}]' <<<"${ags_suites}")

          {
            echo "db-tests=${db_tests}"
            echo "activemq-profiles=${activemq_profiles}"
            echo "app-context-tests=${app_context_tests}"
            echo "tas-tests=${tas_tests}"
            echo "ags-rest-api-suites=${ags_suites}"
          } | tee -a "${GITHUB_OUTPUT}"

  pre_commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    if: >
      !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
      !contains(needs.commit_parser.outputs.title, '[force]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          # Separate cache so this job (which only resolves plugins) never saves a partial Maven repository
          # under the main key. The prefix must not start with "maven" or other jobs' restore-keys would match it.
          cache-key-prefix: pre-commit-maven
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0

  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    if: >
      !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
      !contains(needs.commit_parser.outputs.title, '[force]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Prepare maven cache and check compilation"
        run: bash ./scripts/ci/prepare.sh
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  test_run_check:
    name: "Test run check"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    outputs:
      tests: ${{ steps.check.outputs.tests }}
    steps:
      - id: check
        run: |
          echo "tests=true" >> "$GITHUB_OUTPUT"
        if: >
          (
            (github.ref_name == 'master' || startsWith(github.ref_name, 'release/') || github.event_name == 'pull_request') &&
            !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
            !contains(needs.commit_parser.outputs.title, '[force]')
          ) ||
          contains(needs.commit_parser.outputs.title, '[run tests]')

  pmd_scan:
    name: "PMD Scan"
    runs-on: ubuntu-latest
    # ya-pmd-scan uploads its findings as SARIF to GitHub code scanning, which needs security-events: write.
    permissions:
      contents: read
      id-token: write
      security-events: write
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - uses: Alfresco/ya-pmd-scan@v4.4.1
        with:
          classpath-build-command: "mvn test-compile -ntp -Pags -pl \"-:alfresco-community-repo-docker\""

  all_unit_tests_suite:
    name: ${{ matrix.testName }} - AllUnitTestsSuite - Build and test
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - testName: Core, Data-Model, Mmt
            testModule: core,data-model,mmt
            testAttributes: "-Dtest=AllCoreUnitTestSuite,AllDataModelUnitTestSuite,AllMmtUnitTestSuite"
          - testName: Repository
            testModule: repository
            testAttributes: "-Dtest=AllUnitTestsSuite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Run tests"
        run: |
          mvn -B test -pl ${{ matrix.testModule }} -am ${{ matrix.testAttributes }} -Dsurefire.failIfNoSpecifiedTests=false "${args[@]}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  remote_api_app_context_test_suites:
    name: >
      ${{ matrix.testSuite == 'org.alfresco.rest.api.tests.RenditionsTest' && 
      'Alfresco Base T-Engine compatibility test' || 
      format('Remote-api - {0}', matrix.testSuite) }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'

    env:
      REQUIRES_INSTALLED_ARTIFACTS: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - testSuite: AppContext01TestSuite
            compose-profile: default
          - testSuite: AppContext02TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContext03TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContext04TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContextExtraTestSuite
            compose-profile: default
          # Compatibility test with the first Alfresco Base T-Engine compatible version
          - testSuite: org.alfresco.rest.api.tests.RenditionsTest
            compose-profile: with-transform-core-aio
            transformers-tag: 5.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}

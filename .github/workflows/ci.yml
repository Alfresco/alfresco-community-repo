name: Alfresco Community Repo CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  push:
    branches:
      - feature/**
      - fix/**
  workflow_call:
    secrets:
      AGS_AWS_ACCESS_KEY_ID:
        required: false
      AGS_AWS_SECRET_ACCESS_KEY:
        required: false
      AUTH0_OIDC_ADMIN_CLIENT_ID:
        required: false
      AUTH0_OIDC_ADMIN_PASSWORD:
        required: false
      AUTH0_OIDC_CLIENT_SECRET:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_USERNAME:
        required: false
      GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY:
        required: false
      NEXUS_PASSWORD:
        required: false
      NEXUS_USERNAME:
        required: false
      QUAY_PASSWORD:
        required: false
      QUAY_USERNAME:
        required: false
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  LOG_WARN: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  CI_WORKSPACE: ${{ github.workspace }}
  TAS_ENVIRONMENT: ./packaging/tests/environment
  TAS_SCRIPTS: ../alfresco-community-repo/packaging/tests/scripts
  BUILD_OUTPUT_DIR: /tmp/build-output
  DOCKER_IMAGES_DIR: /tmp/docker-images
  MVN_TEST_ARGS: "-ntp -nsu"
  MAVEN_BUILD_THREADS: "1C"

jobs:
  commit_parser:
    name: "Parse commit metadata"
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-commit-message@v18.20.0
        id: get-commit
        with:
          header-only: "true"

  prepare_check:
    name: "Prepare - Check"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    if: >
      !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
      !contains(needs.commit_parser.outputs.title, '[force]')
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v18.20.0
  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    if: >
      !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
      !contains(needs.commit_parser.outputs.title, '[force]')
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Build the whole reactor once"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: bash ./scripts/ci/prepare.sh
      - name: "Pack the build output for the test jobs"
        run: bash ./scripts/ci/save_build_output.sh
      - name: "Upload the build output"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
          retention-days: 1
          compression-level: 0 # already zstd compressed
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  test_run_check:
    name: "Test run check"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    outputs:
      tests: ${{ steps.check.outputs.tests }}
    steps:
      - id: check
        run: |
          echo "tests=true" >> "$GITHUB_OUTPUT"
        if: >
          (
            (github.ref_name == 'master' || startsWith(github.ref_name, 'release/') || github.event_name == 'pull_request') &&
            !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
            !contains(needs.commit_parser.outputs.title, '[force]')
          ) ||
          contains(needs.commit_parser.outputs.title, '[run tests]')

  docker_images:
    name: "Build Docker images"
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'
    env:
      # build.sh turns this into "-Pbuild-docker-images -Pags", which is the
      # same command the image-consuming jobs used to run one by one.
      REQUIRES_LOCAL_IMAGES: true
      BUILD_OPTIONS: "-ntp -nsu -Dmaven.artifact.threads=8"
      BUILD_MODULES: "packaging/docker-alfresco,amps/ags/rm-community/rm-community-repo"
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Build the images"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: bash ./scripts/ci/build.sh
      - name: "Pack the images for the test jobs"
        run: bash ./scripts/ci/save_docker_images.sh
      - name: "Upload the images"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-images
          path: ${{ env.DOCKER_IMAGES_DIR }}
          retention-days: 1
          compression-level: 0 # already zstd compressed
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  pmd_scan:
    name: "PMD Scan"
    runs-on: ubuntu-latest
    # ya-pmd-scan uploads its findings as SARIF to GitHub code scanning, which needs security-events: write.
    permissions:
      contents: read
      security-events: write
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true' && github.event_name == 'pull_request'
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/ya-pmd-scan@v4.4.1
        with:
          classpath-build-command: "mvn test-compile -ntp -Pags -pl \"-:alfresco-community-repo-docker\""

  all_unit_tests_suite:
    name: ${{ matrix.testName }} - AllUnitTestsSuite - Build and test
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - testName: Core
            testModule: core
            testAttributes: "-Dtest=AllCoreUnitTestSuite"
          - testName: Data-Model
            testModule: data-model
            testAttributes: "-Dtest=AllDataModelUnitTestSuite"
          - testName: Repository
            testModule: repository
            testAttributes: "-Dtest=AllUnitTestsSuite"
          - testName: Mmt
            testModule: mmt
            testAttributes: "-Dtest=AllMmtUnitTestSuite"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Run tests"
        run: |
          mvn -B ${MVN_TEST_ARGS} test -pl ${{ matrix.testModule }} -am ${{ matrix.testAttributes }} -DfailIfNoTests=false "${args[@]}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  remote_api_app_context_test_suites:
    name: >
      ${{ matrix.testSuite == 'org.alfresco.rest.api.tests.RenditionsTest' && 
      'Alfresco Base T-Engine compatibility test' || 
      format('Remote-api - {0}', matrix.testSuite) }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'

    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - testSuite: AppContext01TestSuite
            compose-profile: default
          - testSuite: AppContext02TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContext03TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContext04TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContextExtraTestSuite
            compose-profile: default
          # Compatibility test with the first Alfresco Base T-Engine compatible version
          - testSuite: org.alfresco.rest.api.tests.RenditionsTest
            compose-profile: with-transform-core-aio
            transformers-tag: 5.2.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Set transformers tag"
        run: |
          if [ -n "${{ matrix.transformers-tag }}" ]; then
            echo "TRANSFORMERS_TAG=${{ matrix.transformers-tag }}" >> $GITHUB_ENV
          else
            echo "TRANSFORMERS_TAG=$(mvn help:evaluate -Dexpression=dependency.alfresco-transform-core.version -q -DforceStdout)" >> $GITHUB_ENV
          fi
      - name: "Set up the environment"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose.yaml --profile ${{ matrix.compose-profile }} up -d
      - name: "Run tests"
        run: mvn -B ${MVN_TEST_ARGS} test -pl remote-api -Dtest=${{ matrix.testSuite }} -Ddb.driver=org.postgresql.Driver -Ddb.name=alfresco -Ddb.url=jdbc:postgresql://localhost:5433/alfresco -Ddb.username=alfresco -Ddb.password=alfresco -Dmessaging.broker.username=admin -Dmessaging.broker.password=admin # pragma: allowlist secret
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_mariadb_tests:
    name: Repository - MariaDB 10.11 tests
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
      - commit_parser
    if: needs.test_run_check.outputs.tests == 'true' && (github.event_name != 'pull_request' || contains(needs.commit_parser.outputs.title, '[db]'))
    strategy:
      fail-fast: false
      matrix:
        version: ['10.11']
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: Run MariaDB ${{ matrix.version }} database
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose-db.yaml --profile mariadb up -d
        env:
          MARIADB_VERSION: ${{ matrix.version }}
      - name: "Run tests"
        run: mvn -B ${MVN_TEST_ARGS} test -pl repository -am -Dtest=AllDBTestsTestSuite -DfailIfNoTests=false -Ddb.name=alfresco -Ddb.url=jdbc:mariadb://localhost:3307/alfresco?useUnicode=yes\&characterEncoding=UTF-8 -Ddb.username=alfresco -Ddb.password=alfresco -Ddb.driver=org.mariadb.jdbc.Driver # pragma: allowlist secret
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_mariadb_11_8_tests:
    name: "Repository - MariaDB 11.8 tests"
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Run MariaDB 11.8 database"
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose-db.yaml --profile mariadb up -d
        env:
          MARIADB_VERSION: 11.8
      - name: "Run tests"
        run: mvn -B ${MVN_TEST_ARGS} test -pl repository -am -Dtest=AllDBTestsTestSuite -DfailIfNoTests=false -Ddb.name=alfresco -Ddb.url=jdbc:mariadb://localhost:3307/alfresco?useUnicode=yes\&characterEncoding=UTF-8 -Ddb.username=alfresco -Ddb.password=alfresco -Ddb.driver=org.mariadb.jdbc.Driver # pragma: allowlist secret
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_mysql_tests:
    name: Repository - MySQL 8 tests
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Run MySQL 8 database"
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose-db.yaml --profile mysql up -d
        env:
          MYSQL_VERSION: 8
      - name: "Run tests"
        run: mvn -B ${MVN_TEST_ARGS} test -pl repository -am -Dtest=AllDBTestsTestSuite -DfailIfNoTests=false -Ddb.driver=com.mysql.jdbc.Driver -Ddb.name=alfresco -Ddb.url=jdbc:mysql://localhost:3307/alfresco -Ddb.username=alfresco -Ddb.password=alfresco # pragma: allowlist secret
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_postgresql_15_17_tests:
    name: "Repository - PostgreSQL 15.17 tests"
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
      - commit_parser
    if: needs.test_run_check.outputs.tests == 'true' && (github.event_name != 'pull_request' || contains(needs.commit_parser.outputs.title, '[db]'))
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Run PostgreSQL 15.17 database"
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose-db.yaml --profile postgres up -d
        env:
          POSTGRES_VERSION: 15.17
      - name: "Run tests"
        run: mvn -B ${MVN_TEST_ARGS} test -pl repository -am -Dtest=AllDBTestsTestSuite -DfailIfNoTests=false -Ddb.driver=org.postgresql.Driver -Ddb.name=alfresco -Ddb.url=jdbc:postgresql://localhost:5433/alfresco -Ddb.username=alfresco -Ddb.password=alfresco # pragma: allowlist secret
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_postgresql_16_13_tests:
    name: "Repository - PostgreSQL 16.13 tests"
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
      - commit_parser
    if: needs.test_run_check.outputs.tests == 'true' && (github.event_name != 'pull_request' || contains(needs.commit_parser.outputs.title, '[db]'))
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

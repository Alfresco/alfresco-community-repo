      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_db_tests:
    name: Repository - ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    needs:
      - commit_parser
      - prepare
      - test_run_check
    # On PRs commit_parser drops the pr-gated entries unless the title contains [db]
    if: needs.test_run_check.outputs.tests == 'true' && needs.commit_parser.outputs.db-tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit_parser.outputs.db-tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: Run ${{ matrix.name }} database
        # Only the variable of the selected profile is used
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose-db.yaml --profile ${{ matrix.profile }} up -d
        env:
          MARIADB_VERSION: ${{ matrix.version }}
          MYSQL_VERSION: ${{ matrix.version }}
          POSTGRES_VERSION: ${{ matrix.version }}
      - name: "Run tests"
        env:
          DB_PROFILE: ${{ matrix.profile }}
        # detect-secrets reports a block scalar at its key line, so the pragma has to be on the run: line
        run: | # pragma: allowlist secret
          case "${DB_PROFILE}" in
            mariadb)  db_args=(-Ddb.driver=org.mariadb.jdbc.Driver "-Ddb.url=jdbc:mariadb://localhost:3307/alfresco?useUnicode=yes&characterEncoding=UTF-8") ;;
            mysql)    db_args=(-Ddb.driver=com.mysql.jdbc.Driver -Ddb.url=jdbc:mysql://localhost:3307/alfresco) ;;
            postgres) db_args=(-Ddb.driver=org.postgresql.Driver -Ddb.url=jdbc:postgresql://localhost:5433/alfresco) ;;
          esac
          mvn -B test -pl repository -am -Dtest=AllDBTestsTestSuite -Dsurefire.failIfNoSpecifiedTests=false -Ddb.name=alfresco -Ddb.username=alfresco -Ddb.password=alfresco "${db_args[@]}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh


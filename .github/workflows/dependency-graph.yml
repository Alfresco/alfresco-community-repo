name: "Load Dependency Graph"
# Default to the least privilege for all jobs; individual jobs elevate as needed.
permissions:
  contents: read

on:
  push:
    branches:
      - "master"
      - "release/25.N"
      - "release/23.N"
      - "release/7.4.N"
  schedule:
    - cron: '0 6 * * *'
  workflow_call:
  workflow_dispatch:

jobs:
  scan-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Submitting the dependency snapshot via the Dependency Submission API requires write access.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-dependency-scan@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          java-version: '21'
          maven-version: '3.9.9'
          maven-args: -Dscopes=compile,runtime
          maven-settings-path: ".ci.settings.xml"

name: Pre-Commit formatter

# Default to least privilege for all jobs; individual jobs elevate as needed.
permissions:
  contents: read

on:
  push:
    branches:
      - precommit/**
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used to run the pre-commit formatter"
        required: false
        default: "3.9"

jobs:
  format-code:
    name: "Reformat code"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: contains(github.event.head_commit.message, '[reformat code]')
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      # The check-format-and-headers hook runs Maven, so it needs the CI settings and credentials.
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          java-version: "21"
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true
        with:
          extra_args: --all-files
      - name: Update secrets baseline
        run: pip install detect-secrets && detect-secrets scan --baseline .secrets.baseline
      - uses: iarekylew00t/verified-bot-commit@3a1e72c2443cce5574f76a9b2bb36e355d667743 # v2.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          files: |
            **/*.java
            .secrets.baseline
          message: "Apply Pre-Commit code formatting"
          if-no-commit: info

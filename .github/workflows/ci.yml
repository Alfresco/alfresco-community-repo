      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Download the locally built Docker images"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-images
          path: ${{ env.DOCKER_IMAGES_DIR }}
      - name: "Load the locally built Docker images"
        run: bash ./scripts/ci/load_docker_images.sh
      - name: "Set up the environment"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: |
          ${{ env.TAS_SCRIPTS }}/start-compose.sh ./amps/ags/rm-community/rm-community-repo/docker-compose.yml
          ${{ env.TAS_SCRIPTS }}/wait-for-alfresco-start.sh "http://localhost:8080/alfresco"
          mvn -B ${MVN_TEST_ARGS} install -pl :alfresco-governance-services-automation-community-rest-api -am -Pags -Pall-tas-tests -DskipTests
      - name: "Test"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn -B ${MVN_TEST_ARGS} test -pl :alfresco-governance-services-automation-community-rest-api -Dskip.automationtests=false -DsuiteXmlFile=testng-part${{ matrix.part }}.xml -Pags -Pall-tas-tests
      - name: "Configure AWS credentials"
        if: ${{ always() }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          aws-access-key-id: ${{ secrets.AGS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AGS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: "Upload artifacts to Amazon S3 bucket"
        if: ${{ always() }}
        # Both matrix legs run at once, so the destination must include
        # matrix.part - without it, the two legs would race to overwrite the
        # same S3 keys and one leg's logs would silently disappear.
        run: |
          bash amps/ags/ci/scripts/getLogs.sh
          aws s3 cp --acl private alfresco.log s3://ags-travis-artifacts/community/${{ github.run_number }}/AGS-Community-Rest-API-Tests/part${{ matrix.part }}/alfresco.log
          aws s3 cp --acl private solr.log s3://ags-travis-artifacts/community/${{ github.run_number }}/AGS-Community-Rest-API-Tests/part${{ matrix.part }}/solr.log
          aws s3 cp --acl private ./amps/ags/rm-automation/rm-automation-community-rest-api/target/reports/rm-automation-community-rest-api.log s3://ags-travis-artifacts/community/${{ github.run_number }}/AGS-Community-Rest-API-Tests/part${{ matrix.part }}/rm-automation-community-rest-api.log
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  ags_start_api_explorer:
    name: "Test Tomcat deployment of api explorer"
    runs-on: ubuntu-latest
    needs:
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v18.20.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.20.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Download the shared build output"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT_DIR }}
      - name: "Restore the shared build output"
        run: bash ./scripts/ci/restore_build_output.sh
      - name: "Test Tomcat deployment"
        run: |
          mvn -B ${MVN_TEST_ARGS} verify -Pags,start-api-explorer -DskipTests &
          ${{ env.TAS_SCRIPTS }}/wait-for-alfresco-start.sh "http://localhost:8085/api-explorer"

name: Alfresco Community Repo CI jobs

# The CI jobs, called by ci.yml (never triggered directly).
# - "How" to test lives here and is shared: release branches run master's copy of this file.
# - "What" to test lives in .github/ci-config.yml on each branch, next to the code it describes. It is read from the
#   checked-out branch by the "Resolve CI configuration" step in commit_parser.
# Rule for changes here: release branches run this file against their own code and scripts, so keep the way jobs call
# branch scripts (scripts/ci/*.sh) backward compatible, and switch new test jobs on through a new ci-config.yml key.

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    secrets:
      AGS_AWS_ACCESS_KEY_ID:
        required: false
      AGS_AWS_SECRET_ACCESS_KEY:
        required: false
      AUTH0_OIDC_ADMIN_CLIENT_ID:
        required: false
      AUTH0_OIDC_ADMIN_PASSWORD:
        required: false
      AUTH0_OIDC_CLIENT_SECRET:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_USERNAME:
        required: false
      GH_APP_ENGINEERING_RO_PRIVATE_KEY:
        required: false
      QUAY_PASSWORD:
        required: false
      QUAY_USERNAME:
        required: false

# Cancel superseded runs for pull requests and feature/fix branch pushes. Master/release runs (including those via
# master_release.yml, where github.* describes the caller) get a unique group so they are never cancelled or queued.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/'))
    && format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref)
    || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

env:
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  LOG_WARN: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  CI_WORKSPACE: ${{ github.workspace }}
  TAS_ENVIRONMENT: ./packaging/tests/environment
  TAS_SCRIPTS: ../alfresco-community-repo/packaging/tests/scripts

jobs:
  commit_parser:
    name: "Parse commit metadata"
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
      java-version: ${{ steps.ci-config.outputs.java-version }}
      db-tests: ${{ steps.ci-config.outputs.db-tests }}
      activemq-profiles: ${{ steps.ci-config.outputs.activemq-profiles }}
      app-context-tests: ${{ steps.ci-config.outputs.app-context-tests }}
      tas-tests: ${{ steps.ci-config.outputs.tas-tests }}
      ags-rest-api-suites: ${{ steps.ci-config.outputs.ags-rest-api-suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-commit-message@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        id: get-commit
        with:
          header-only: "true"
      # Reads what this branch can test from its own .github/ci-config.yml. A missing list key means "no such jobs",
      # so a test job added to master later stays off on older branches until their ci-config.yml lists it.
      - name: "Resolve CI configuration"
        id: ci-config
        env:
          CI_CONFIG: .github/ci-config.yml
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_TITLE: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
        run: |
          set -euo pipefail
          fail() { echo "::error file=${CI_CONFIG},title=Invalid CI configuration::$1"; exit 1; }
          [[ -f "${CI_CONFIG}" ]] || fail "${CI_CONFIG} not found: every branch needs one"
          # The list under the given key as compact JSON, [] when the key is missing
          list() { yq -o=json -I=0 ".[\"$1\"] // []" "${CI_CONFIG}"; }
          is_string_list='type == "array" and all(.[]; type == "string")'

          java_version=$(yq '.["java-version"] // ""' "${CI_CONFIG}")
          [[ "${java_version}" =~ ^[0-9]+$ ]] || fail "java-version must be set, for example \"21\""

          db_tests=$(list db-tests)
          jq -e 'type == "array" and all(.[]; (.name | type == "string") and (.profile | IN("mariadb", "mysql", "postgres")) and (.version | type == "string"))' <<<"${db_tests}" >/dev/null \
            || fail "db-tests: every entry needs a name, a profile (mariadb, mysql or postgres) and a quoted version"
          # pr-gated DB tests run on PRs only when the title contains [db] (case-insensitive, like contains())
          shopt -s nocasematch
          if [[ "${EVENT_NAME}" == "pull_request" && "${COMMIT_TITLE}" != *"[db]"* ]]; then
            db_tests=$(jq -c '[.[] | select(."pr-gated" != true)]' <<<"${db_tests}")
          fi
          shopt -u nocasematch

          activemq_profiles=$(list activemq-profiles)
          jq -e "${is_string_list}" <<<"${activemq_profiles}" >/dev/null || fail "activemq-profiles must be a list of profile names"

          app_context_tests=$(list app-context-tests)
          jq -e 'type == "array" and all(.[]; (.testSuite | type == "string") and (."compose-profile" | type == "string"))' <<<"${app_context_tests}" >/dev/null \
            || fail "app-context-tests: every entry needs a testSuite and a compose-profile"

          tas_tests=$(list tas-tests)
          jq -e 'type == "array" and all(.[]; (."test-name" | type == "string") and (."pom-dir" | type == "string"))' <<<"${tas_tests}" >/dev/null \
            || fail "tas-tests: every entry needs a test-name and a pom-dir"

          ags_suites=$(list ags-rest-api-suites)
          jq -e "${is_string_list}" <<<"${ags_suites}" >/dev/null || fail "ags-rest-api-suites must be a list of TestNG suite files"
          # testng-part1.xml -> part1 (keeps the job names and S3 paths); testng.xml -> all
          ags_suites=$(jq -c '[.[] | {name: (rtrimstr(".xml") | ltrimstr("testng") | ltrimstr("-") | if . == "" then "all" else . end), "suite-file": .}]' <<<"${ags_suites}")

          # Job outputs must not look like they hold a password, or GitHub drops them
          for value in "${db_tests}" "${activemq_profiles}" "${app_context_tests}" "${tas_tests}" "${ags_suites}"; do
            [[ "${value,,}" != *password* ]] || fail "keep credentials out of ${CI_CONFIG}; pass them in the job step instead"
          done

          {
            echo "java-version=${java_version}"
            echo "db-tests=${db_tests}"
            echo "activemq-profiles=${activemq_profiles}"
            echo "app-context-tests=${app_context_tests}"
            echo "tas-tests=${tas_tests}"
            echo "ags-rest-api-suites=${ags_suites}"
          } | tee -a "${GITHUB_OUTPUT}"

  pre_commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    if: >
      !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
      !contains(needs.commit_parser.outputs.title, '[force]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
          # Separate cache so this job (which only resolves plugins) never saves a partial Maven repository
          # under the main key. The prefix must not start with "maven" or other jobs' restore-keys would match it.
          cache-key-prefix: pre-commit-maven
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0

  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    if: >
      !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
      !contains(needs.commit_parser.outputs.title, '[force]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Prepare maven cache and check compilation"
        run: bash ./scripts/ci/prepare.sh
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  test_run_check:
    name: "Test run check"
    runs-on: ubuntu-latest
    needs: [commit_parser]
    outputs:
      tests: ${{ steps.check.outputs.tests }}
    steps:
      - id: check
        run: |
          echo "tests=true" >> "$GITHUB_OUTPUT"
        if: >
          (
            (github.ref_name == 'master' || startsWith(github.ref_name, 'release/') || github.event_name == 'pull_request') &&
            !contains(needs.commit_parser.outputs.title, '[skip tests]') &&
            !contains(needs.commit_parser.outputs.title, '[force]')
          ) ||
          contains(needs.commit_parser.outputs.title, '[run tests]')

  pmd_scan:
    name: "PMD Scan"
    runs-on: ubuntu-latest
    # ya-pmd-scan uploads its findings as SARIF to GitHub code scanning, which needs security-events: write.
    permissions:
      contents: read
      id-token: write
      security-events: write
    needs:
      - commit_parser
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - uses: Alfresco/ya-pmd-scan@v4.4.1
        with:
          classpath-build-command: "mvn test-compile -ntp -Pags -pl \"-:alfresco-community-repo-docker\""

  all_unit_tests_suite:
    name: ${{ matrix.testName }} - AllUnitTestsSuite - Build and test
    runs-on: ubuntu-latest
    needs:
      - commit_parser
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - testName: Core, Data-Model, Mmt
            testModule: core,data-model,mmt
            testAttributes: "-Dtest=AllCoreUnitTestSuite,AllDataModelUnitTestSuite,AllMmtUnitTestSuite"
          - testName: Repository
            testModule: repository
            testAttributes: "-Dtest=AllUnitTestsSuite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Run tests"
        run: |
          mvn -B test -pl ${{ matrix.testModule }} -am ${{ matrix.testAttributes }} -Dsurefire.failIfNoSpecifiedTests=false "${args[@]}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  remote_api_app_context_test_suites:
    name: >
      ${{ matrix.testSuite == 'org.alfresco.rest.api.tests.RenditionsTest' && 
      'Alfresco Base T-Engine compatibility test' || 
      format('Remote-api - {0}', matrix.testSuite) }}
    runs-on: ubuntu-latest
    needs:
      - commit_parser
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true'

    env:
      REQUIRES_INSTALLED_ARTIFACTS: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - testSuite: AppContext01TestSuite
            compose-profile: default
          - testSuite: AppContext02TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContext03TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContext04TestSuite
            compose-profile: with-transform-core-aio
          - testSuite: AppContextExtraTestSuite
            compose-profile: default
          # Compatibility test with the first Alfresco Base T-Engine compatible version
          - testSuite: org.alfresco.rest.api.tests.RenditionsTest
            compose-profile: with-transform-core-aio
            transformers-tag: 5.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: |
          bash ./scripts/ci/init.sh
          bash ./scripts/ci/build.sh
      - name: "Set transformers tag"
        run: |
          if [ -n "${{ matrix.transformers-tag }}" ]; then
            echo "TRANSFORMERS_TAG=${{ matrix.transformers-tag }}" >> $GITHUB_ENV
          else
            echo "TRANSFORMERS_TAG=$(mvn help:evaluate -Dexpression=dependency.alfresco-transform-core.version -q -DforceStdout)" >> $GITHUB_ENV
          fi
      - name: "Set up the environment"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose.yaml --profile ${{ matrix.compose-profile }} up -d
      - name: "Run tests"
        run: mvn -B test -pl remote-api -Dtest=${{ matrix.testSuite }} -Ddb.driver=org.postgresql.Driver -Ddb.name=alfresco -Ddb.url=jdbc:postgresql://localhost:5433/alfresco -Ddb.username=alfresco -Ddb.password=alfresco -Dmessaging.broker.username=admin -Dmessaging.broker.password=admin # pragma: allowlist secret
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_db_tests:
    name: Repository - ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    needs:
      - commit_parser
      - prepare
      - test_run_check
    # On PRs commit_parser drops the pr-gated entries unless the title contains [db]
    if: needs.test_run_check.outputs.tests == 'true' && needs.commit_parser.outputs.db-tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit_parser.outputs.db-tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: Run ${{ matrix.name }} database
        # Only the variable of the selected profile is used
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose-db.yaml --profile ${{ matrix.profile }} up -d
        env:
          MARIADB_VERSION: ${{ matrix.version }}
          MYSQL_VERSION: ${{ matrix.version }}
          POSTGRES_VERSION: ${{ matrix.version }}
      - name: "Run tests"
        env:
          DB_PROFILE: ${{ matrix.profile }}
        # detect-secrets reports a block scalar at its key line, so the pragma has to be on the run: line
        run: | # pragma: allowlist secret
          case "${DB_PROFILE}" in
            mariadb)  db_args=(-Ddb.driver=org.mariadb.jdbc.Driver "-Ddb.url=jdbc:mariadb://localhost:3307/alfresco?useUnicode=yes&characterEncoding=UTF-8") ;;
            mysql)    db_args=(-Ddb.driver=com.mysql.jdbc.Driver -Ddb.url=jdbc:mysql://localhost:3307/alfresco) ;;
            postgres) db_args=(-Ddb.driver=org.postgresql.Driver -Ddb.url=jdbc:postgresql://localhost:5433/alfresco) ;;
          esac
          mvn -B test -pl repository -am -Dtest=AllDBTestsTestSuite -Dsurefire.failIfNoSpecifiedTests=false -Ddb.name=alfresco -Ddb.username=alfresco -Ddb.password=alfresco "${db_args[@]}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_messaging_tests:
    name: Repository - Messaging tests against ${{ matrix.activemq }}
    runs-on: ubuntu-latest
    needs:
      - commit_parser
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true' && needs.commit_parser.outputs.activemq-profiles != '[]'
    strategy:
      fail-fast: false
      matrix:
        activemq: ${{ fromJSON(needs.commit_parser.outputs.activemq-profiles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Run ActiveMQ"
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose.yaml --profile ${{ matrix.activemq }} up -d
      - name: "Run tests"
        run: mvn -B test -pl repository -am -Dtest=CamelRoutesTest,CamelComponentsTest -Dsurefire.failIfNoSpecifiedTests=false -Dmessaging.broker.username=admin -Dmessaging.broker.password=admin # pragma: allowlist secret
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  repository_app_context_test_suites:
    name: Repository - ${{ matrix.testSuite }} ${{ matrix.idp }}
    runs-on: ubuntu-latest
    needs:
      - commit_parser
      - prepare
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true' && needs.commit_parser.outputs.app-context-tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit_parser.outputs.app-context-tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Set transformers tag"
        run: echo "TRANSFORMERS_TAG=$(mvn help:evaluate -Dexpression=dependency.alfresco-transform-core.version -q -DforceStdout)" >> $GITHUB_ENV
      - name: "Set the host IP"
        run: echo "HOST_IP=$(hostname  -I | cut -f1 -d' ')" >> $GITHUB_ENV
      - name: "Generate GitHub App token"
        id: app-token
        if: ${{ matrix.mtls }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_RO_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_RO_PRIVATE_KEY }}
          permission-contents: read
      - name: "Generate Keystores and Truststores for Mutual TLS configuration"
        if: ${{ matrix.mtls }}
        run: |
          git clone -b "master" --depth=1 "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/Alfresco/alfresco-ssl-generator.git"
          if ${{ matrix.disabledHostnameVerification }} ; then
            bash ${{ env.CI_WORKSPACE }}/alfresco-ssl-generator/scripts/ci/generate_keystores_wrong_hostnames.sh
            echo "HOSTNAME_VERIFICATION_DISABLED=true" >> "$GITHUB_ENV"
          else
            bash ${{ env.CI_WORKSPACE }}/alfresco-ssl-generator/scripts/ci/generate_keystores.sh
            echo "HOSTNAME_VERIFICATION_DISABLED=false" >> "$GITHUB_ENV"
          fi
      - name: "Set up the environment"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: docker compose -f ./scripts/ci/docker-compose/docker-compose.yaml --profile ${{ matrix.compose-profile }} up -d
      - name: "Run tests"
        env:
          AUTH0_CLIENT_ID: ${{ matrix.idp == 'Auth0' && secrets.AUTH0_OIDC_ADMIN_CLIENT_ID || '' }}
          AUTH0_CLIENT_SECRET: ${{ matrix.idp == 'Auth0' && secrets.AUTH0_OIDC_CLIENT_SECRET || '' }}
          AUTH0_ADMIN_PASSWORD: ${{ matrix.idp == 'Auth0' && secrets.AUTH0_OIDC_ADMIN_PASSWORD || '' }}
        # The Auth0 credential options are added here and not in ci-config.yml: GitHub drops a job output that looks
        # like it contains a password. detect-secrets needs the pragma on the run: line.
        run: | # pragma: allowlist secret
          mvn -B test -pl repository -am -Dtest=${{ matrix.testSuite }} -Dsurefire.failIfNoSpecifiedTests=false -Ddb.driver=org.postgresql.Driver -Ddb.name=alfresco -Ddb.url=jdbc:postgresql://localhost:5433/alfresco -Ddb.username=alfresco -Ddb.password=alfresco -Dmessaging.broker.username=admin -Dmessaging.broker.password=admin ${{ matrix.mvn-options }} \
            ${{ matrix.idp == 'Auth0' && '-Didentity-service.credentials.secret=${AUTH0_CLIENT_SECRET} -Dadmin.password=${AUTH0_ADMIN_PASSWORD} -Dauth0.admin.password=${AUTH0_ADMIN_PASSWORD}' || '' }}
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  tas_tests:
    name: ${{ matrix.test-name }}
    runs-on: ubuntu-latest
    # Not gated on Prepare: this job builds the whole reactor itself and is on the critical path
    needs:
      - commit_parser
      - test_run_check
    if: needs.test_run_check.outputs.tests == 'true' && needs.commit_parser.outputs.tas-tests != '[]'
    env:
      # Community image only: just the AGS Community REST API job needs the AGS modules and image.
      # -Pall-tas-tests goes through BUILD_PROFILES (not REQUIRES_TAS_TESTS) because every branch's build.sh supports it.
      BUILD_PROFILES: "-Pbuild-docker-images -Pall-tas-tests"
      REQUIRES_INSTALLED_ARTIFACTS: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.commit_parser.outputs.tas-tests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ needs.commit_parser.outputs.java-version }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: |
          bash ./scripts/ci/init.sh
          bash ./scripts/ci/build.sh
      - name: "Set transformers tag"
        run: echo "TRANSFORMERS_TAG=$(mvn help:evaluate -Dexpression=dependency.alfresco-transform-core.version -q -DforceStdout)" >> $GITHUB_ENV
      - name: "Set up the environment"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: |
          ${{ env.TAS_SCRIPTS }}/start-compose.sh ${{ env.TAS_ENVIRONMENT }}/${{ matrix.compose-file || 'docker-compose-minimal+transforms.yml' }}
          ${{ env.TAS_SCRIPTS }}/wait-for-alfresco-start.sh "http://localhost:8082/alfresco"
      - name: "Run tests"
        id: tests
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn -B verify -f packaging/tests/${{ matrix.pom-dir }}/pom.xml -Pall-tas-tests,${{ matrix.test-profile }} -Denvironment=default -DrunBugs=false ${{ matrix.mvn-options }}
      - name: "Print output after success"
        if: ${{ always() && steps.tests.outcome == 'success' }}
        run: ${TAS_SCRIPTS}/output_tests_run.sh "packaging/tests/${{ matrix.pom-dir }}"
      - name: "Print output after failure"
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: ${TAS_SCRIPTS}/output_logs_for_failures.sh "packaging/tests/${{ matrix.pom-dir }}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh


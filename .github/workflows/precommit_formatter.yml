name: Pre-Commit formatter

# Default to least privilege for all jobs; individual jobs elevate as needed.
permissions:
  contents: read

on:
  push:
    branches:
      - precommit/**
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used to run the pre-commit formatter"
        required: false
        default: "3.9"

jobs:
  format-code:
    name: "Reformat code"
    runs-on: ubuntu-latest
    # Commits the reformatted code and pushes it back using the default GITHUB_TOKEN.
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[reformat code]')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true
        with:
          extra_args: --all-files
      - name: Update secrets baseline
        run: pip install detect-secrets && detect-secrets scan --baseline .secrets.baseline
      - uses: Alfresco/alfresco-build-tools/.github/actions/git-commit-changes@v18.18.0
        with:
          username: ${{ vars.BOT_GITHUB_USERNAME }}
          add-options: -u
          commit-message: "Apply Pre-Commit code formatting"
          skip-if-no-changes: true
      - name: Push changes
        run: git push

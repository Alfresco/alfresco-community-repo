name: Master/Release branch workflow

# Read-only is enough for the default GITHUB_TOKEN: the release/downstream jobs
# push using a GitHub App installation token, not the workflow token.
permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - master
      - release/**
env:
  JAVA_VERSION: '21'
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60

jobs:
  commit_parser:
    name: "Parse commit metadata"
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-commit-message@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        id: get-commit
        with:
          header-only: "true"

  run_ci:
    # The reusable CI workflow contains the pmd_scan job which needs security-events: write
    # to upload SARIF; the caller must grant it for the nested job to be allowed.
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/ci.yml
    secrets:
      AGS_AWS_ACCESS_KEY_ID: ${{ secrets.AGS_AWS_ACCESS_KEY_ID }}
      AGS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AGS_AWS_SECRET_ACCESS_KEY }}
      AUTH0_OIDC_ADMIN_CLIENT_ID: ${{ secrets.AUTH0_OIDC_ADMIN_CLIENT_ID }}
      AUTH0_OIDC_ADMIN_PASSWORD: ${{ secrets.AUTH0_OIDC_ADMIN_PASSWORD }}
      AUTH0_OIDC_CLIENT_SECRET: ${{ secrets.AUTH0_OIDC_CLIENT_SECRET }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      GH_APP_ENGINEERING_RO_PRIVATE_KEY: ${{ secrets.GH_APP_ENGINEERING_RO_PRIVATE_KEY }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
  push_to_nexus:
    name: "Push to Nexus"
    runs-on: ubuntu-latest
    needs: [run_ci, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      !contains(needs.commit_parser.outputs.title, '[no release]') &&
      github.event_name != 'pull_request'
    env:
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: "Create local release branch"
        run: git checkout -B "${{ github.ref_name }}"
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Compute release and next development versions"
        id: versions
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-compute-release-versions@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
      - name: "Verify release version"
        run: bash scripts/ci/verify_release_tag.sh
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ steps.versions.outputs.release-version }}
          development-version: ${{ steps.versions.outputs.next-development-version }}
          release-profile: "all-tas-tests,ags,release"
          maven-args: "-DskipTests -Dbuild-number=${{ env.BUILD_NUMBER }}"
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  update_downstream:
    name: "Update alfresco-enterprise-repo"
    runs-on: ubuntu-latest
    needs: [push_to_nexus, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      !contains(needs.commit_parser.outputs.title, '[no downstream]') &&
      github.event_name != 'pull_request'
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          owner: Alfresco
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            alfresco-community-repo
            alfresco-enterprise-repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@2fb68b82ad8ffd30088b5977da32d011af40f6ef # v19.13.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        env:
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: bash ./scripts/ci/init.sh
      - name: "Update downstream"
        id: update-downstream
        run: bash ./scripts/ci/update_downstream.sh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
      # Named here because alfresco-enterprise-repo sees this release as one bot commit.
      - name: "List who is in this release"
        id: authors
        if: github.event.before != '0000000000000000000000000000000000000000'
        # Names are a nicety; losing them must not stop the release propagating.
        continue-on-error: true
        uses: Alfresco/alfresco-build-tools/.github/actions/github-list-pr-authors@837a4dfd80d15ec3bc05b9168b97e0864aa3066c # v19.14.0
        with:
          from-ref: ${{ github.event.before }}
          to-ref: ${{ github.sha }}
      - name: "Compute downstream commit message"
        id: commit-meta
        uses: ./.github/actions/get-downstream-commit-message
        with:
          commit-title: ${{ needs.commit_parser.outputs.title }}
          version: ${{ steps.update-downstream.outputs.version }}
          downstream-repo: community-repo
          # Handles only - this message lands in a repository with a different audience.
          authors: ${{ steps.authors.outputs.cc }}
      - name: "Commit downstream version update"
        uses: iarekylew00t/verified-bot-commit@3a1e72c2443cce5574f76a9b2bb36e355d667743 # v2.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Alfresco/alfresco-enterprise-repo
          ref: ${{ github.ref_name }}
          workspace: ${{ github.workspace }}/../alfresco-enterprise-repo
          files: pom.xml
          message: ${{ steps.commit-meta.outputs.message }}
          allow-empty-commit: ${{ steps.commit-meta.outputs.allow-empty-commit }}
          if-no-commit: info
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh
